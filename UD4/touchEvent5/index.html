<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./index.js"></script>
</head>

<body>

    <div id="carousel__container">

        <div class="carousel__track">

            <div class="img__container">
                <img class="carousel__img"
                    src="https://i.ibb.co/K2KkmJx/florian-olivo-4hb-J-eym-Z1o-unsplash.jpg">
            </div>

            <div class="img__container">
                <img class="carousel__img"
                    src="https://i.ibb.co/3Nmfpsm/jackson-sophat-t-l5-FFH8-VA-unsplash.jpg">
            </div>

            <div class="img__container">
                <img class="carousel__img"
                    src="https://i.ibb.co/sVXbVdr/nathan-da-silva-k-r-Kfq-Sm4-L4-unsplash.jpg">
            </div>

            <div class="img__container">
                <img class="carousel__img"
                    src="https://i.ibb.co/fMf7S4k/kobu-agency-ip-ARHax-ETRk-unsplash.jpg">
            </div>

        </div>

        <button id="prev-btn" class="btn">❮</button>
        <button id="next-btn" class="btn">❯</button>

    </div>

</body>
</html>
