<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta</title>

    <script defer src="./index.js"></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="form">

        <div class="inputDiv">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" placeholder="3242 3423 4234 234">
        </div>

        <div class="inputDiv">
            <label for="cardHolder">Card Holder</label>
            <input type="text" id="cardHolder" placeholder="John Doe">
        </div>

        <div class="expiration">

            <div class="inputDiv">
                <label for="expirationMonth">Expiration Date</label>
                <select id="expirationMonth">
                    <option value="">Month</option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <div class="inputDiv">
                <label for="expirationYear"> </label>
                <select id="expirationYear">
                    <option value="">Year</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>
            </div>

            <div class="inputDiv cvv">
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" maxlength="4">
            </div>

        </div>

        <button type="submit">Submit</button>

    </div>

    <div id="card">
        <h3>VISA</h3>
        <p id="cardNumberShow">**** **** **** ****</p>
        <div id="divdiv">
            <div>

                <p class="cardTitle">Holder</p>
                <p id="cardHolderShow">Vicen Mobo</p>
            </div>
            <div>
                <p class="cardTitle">Exiry Date</p>
                <p id="expirationShow">1/1</p>
            </div>
        </div>
    </div>

</body>
</html>
