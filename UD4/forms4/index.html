
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowdrise - Sign Up</title>
    <script defer src="./index.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="container">

        <!-- LEFT PANEL -->
        <section class="illustration">

            <div class="logo">
                crowdrise
                <small>by gofundme</small>
            </div>


            <div class="illustration-footer">
                © 2018 CrowdRise
            </div>

        </section>

        <!-- RIGHT PANEL -->
        <section class="form-panel">

            <header>
                <button class="menu-button">☰</button>
            </header>

            <div class="form-content">

                <h1>Welcome to Crowdrise</h1>

                <p cla Let's get you all set up so you can verify your
                    nonprofit and begin setting up your first campaign!ss="description">
                   
                </p>

                <p class="login">
                    Already have an account?
                    <a href="#">Log in.</a>
                </p>

                <form>

                    <div class="form-grid">

                        <div class="field">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName"
                                   placeholder="Peter">
                        </div>

                        <div class="field">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName"
                                   placeholder="Deltondo">
                        </div>

                        <div class="field">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone"
                                   placeholder="+34 611 522 152">
                        </div>

                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email"
                                   placeholder="mail@google.com">
                        </div>

                        <div class="field">
                            <label for="password">Password</label>
                            <input type="password" id="password"
                                   placeholder="••••••••••">
                        </div>

                        <div class="field">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword"
                                   placeholder="••••••••••">
                        </div>

                    </div>

                    <div class="checkboxes">

                        <label>
                            <input type="checkbox">
                            Yes, I want to receive Crowdrise's emails
                        </label>

                        <label>
                            <input type="checkbox">
                            I agree to the
                            <a href="#">Terms</a>,
                            <a href="#">Privacy Policy</a>
                            and <a href="#">Fees</a>.
                        </label>

                    </div>

                    <div>
                        <p id="response"></p>
                    </div>

                    <button  class="submit-button" id="submit-button">
                        Sign Up
                    </button>

                </form>

                <p class="bottom-text">
                    Don't work for a nonprofit?
                    <a href="#">You can still fundraise for one.</a>
                </p>

            </div>

            <footer>
                <span>English⌄</span>
            </footer>

        </section>

    </main>

</body>
</html>
