<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./index.js"></script>
</head>

<body>
    <h1>Calculator App</h1>
    <div id="calculatorBody">
        <table id="math">
            
        </table>
        <table id="numbers">
            <tr>
                <td id="response" colspan="4"></td>
            </tr>
            <tr id="math">
                <td>+</td>
                <td>-</td>
                <td>*</td>
                <td>/</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td rowspan="4" id="equal">=</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>

            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>.</td>
                <td>0</td>
                <td>C</td>
            </tr>
        </table>
    </div>
</body>

</html>
