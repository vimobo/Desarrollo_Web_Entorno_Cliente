<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Juego de Supervivencia</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Tiny5&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bloque">

        <h1>Supervivencia</h1>

        <div>
            <p> Vida: <span id="vida"></span></p>
            <p> Comida: <span id="comida"></span></p>
            <p> Puntos: <span id="puntos"></span></p>
            <p>⏱ Tiempo: <span id="tiempo"></span></p>
        </div>


        <div id="divEvento">
            <p id="descripcionEvento">Pulsa el boton para empezar a jugar</p>
            <p id="imagenEfecto"></p>
        </div>


        <div>
            <button onclick="explorar()"> Explorar</button>
            <button onclick="comer()">Comer</button>
            <button onclick="curarse()">Poción</button>
            <button onclick="empezar()"> Empezar a jugar</button>
        </div>

        <div>

            <p>🍖 Comida: <span id="inventarioComida"></span></p>
            <p>🧪 Pociones: <span id="pociones"></span></p>

        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
