<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Juego de Supervivencia</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="bloque">

        <h1>Supervivencia</h1>

        <div>
            <p>❤️ Vida: <span id="vida"></span></p>
            <p>🍖 Comida: <span id="comida"></span></p>
            <p>⭐ Puntos: <span id="puntos"></span></p>
            <p>⏱️ Tiempo: <span id="tiempo"></span></p>
        </div>

        
        <div id="divEvento">
            <p id="descripcionEvento">Pulsa el boton para empezar a jugar</p>
            <img src="" alt="">
        </div>


        <div>
            <button onclick="explorar()"> Explorar</button>
            <button onclick="comer()">Comer</button>
            <button onclick="curarse()">Poción</button>
            <button onclick="empezar()"> Empezar a jugar</button>
        </div>

        <div>

            <p>🍖 Comida: <span id="inventarioComida"></span></p>
            <p>🧪 Pociones: <span id="pociones"></span></p>

        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
